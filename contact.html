<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Header  -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="#">Navbar</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="portfilio.html">Portfolio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="service.html">Service</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Header  -->

    <!-- Contact Form End -->
    <form>
      <div class="container">
        <div class="w-100 m-auto">
          <h2 class="display-5 fw-bold py-3">Contact</h2>
        </div>
        <div class="col-lg-8">
          <div class="">
            <div class="mb-3">
              <label for="formGroupExampleInput" class="form-label"
                >Name</label
              >
              <input type="text" class="form-control" id="nameInpute" />
              <p class="text-danger" id="name" hidden>Enter your Name</p>
            </div>
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label"
                >Email address</label
              >
              <input
                type="email"
                class="form-control"
                id="emailInpute"
                aria-describedby="emailHelp"
              />
              <p class="text-danger" id="email" hidden>Enter your Email</p>
              <div id="emailHelp" class="form-text">
                We'll never share your email with anyone else.
              </div>
            </div>
            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label"
                >Password</label
              >
              <input type="password" class="form-control" id="passwordInpute" />
              <p class="text-danger" id="password" hidden>Enter your Password</p>
            </div>
            <div class="mb-3">
              <label for="formGroupExampleInput" class="form-label"
                >Address</label
              >
              <input type="text" class="form-control" id="addressInpute" />
              <p class="text-danger" id="address" hidden>Enter your Address</p>
            </div>
            <div class="mb-3">
              <label for="textarea" class="form-label">Example textarea</label>
              <textarea class="form-control" id="textariaInpute" rows="3"></textarea>
              <p class="text-danger" id="textaria" hidden>Enter your Text</p>
            </div>
            <button type="submit" class="btn btn-primary" id="subBtn">
              Submit
            </button>
          </div>
        </div>
      </div>
    </form>
    <!-- Contact Form Start -->

    <!-- Map  -->
    <section>
      <div class="container">
        <div class="">
          <div class="w-100 m-auto">
            <h2 class="display-5 fw-bold py-3">Map</h2>
          </div>
        </div>
        <div class="">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d3652.1579073293533!2d90.37993967479169!3d23.74174778910947!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sCreative%20IT%20Institute%2C!5e0!3m2!1sen!2sbd!4v1778184476329!5m2!1sen!2sbd"
            width="600"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </div>
    </section>
    <!-- Map  -->

    <!-- Footer  -->
    <footer
      class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    >
      <div class="col-md-4 d-flex align-items-center">
        <a
          href="/"
          class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1"
          aria-label="Bootstrap"
        >
          <svg class="bi" width="30" height="24" aria-hidden="true">
            <use xlink:href="#bootstrap"></use>
          </svg>
        </a>
        <span class="mb-3 mb-md-0 text-body-secondary"
          >© 2025 Company, Inc</span
        >
        <div class="m-auto">
            <p class="" id="date"></p>
        </div>
      </div>
      <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
        <li class="ms-3">
          <a class="text-body-secondary" href="#" aria-label="Instagram"
            ><svg class="bi" width="24" height="24" aria-hidden="true">
              <use xlink:href="#instagram"></use>
            </svg>
          </a>
        </li>
        <li class="ms-3">
          <a class="text-body-secondary" href="#" aria-label="Facebook">
            <svg class="bi" width="24" height="24">
              <use xlink:href="#facebook"></use>
            </svg>
          </a>
        </li>
      </ul>
    </footer>
    <!-- Footer  -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/script.js"></script>
  </body>
</html>
